<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site-config.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <!-- EDIT: logo / website name (the name comes from js/site-config.js) -->
      <div class="logo" data-site-name>Student Portal</div>
      <div class="logo-sub" data-site-tagline>College Model Lab Practical</div>

        <h2>Continue to the portal</h2>
      <div id="loginMessage" class="message"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="name@example.com" autocomplete="email" required>
          <div class="field-error" id="emailError"></div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="8+ characters, with a letter and number" autocomplete="current-password" required>
          <div class="field-error" id="passwordError"></div>
        </div>
        <button type="submit" class="btn" style="width:100%">Sign in</button>
      </form>

      <p class="notice">Enter a valid email and a password with at least 8 characters, including a letter and a number. This checks format only; accounts are not stored or authenticated.</p>
    </div>
  </div>
</body>
</html>
