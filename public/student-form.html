<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Form - Student Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="studentPortalApp" ng-controller="PortalController as portal" ng-cloak>
  <div class="layout">
    <!-- ===== SIDEBAR (same on every page; edit link names here) ===== -->
    <aside class="sidebar">
      <div class="logo">{{ portal.siteName }}</div>
      <a class="nav-link" ng-repeat="page in portal.pages" ng-href="{{ page.href }}" ng-class="{active: page.href === 'student-form.html'}">{{ page.label }}</a>
    </aside>
    <main class="content" ng-controller="StudentFormController as formCtrl">
      <h1>Student Information Form</h1>
      <p>Fill in all fields. Fields marked * are required.</p>

      <div class="message" ng-if="formCtrl.message" ng-class="{'show': true, 'success': formCtrl.messageType === 'success', 'error': formCtrl.messageType === 'error'}">{{ formCtrl.message }}</div>

      <!-- To add a field, update this form, ValidationService, the Student model, and the API handler. -->
      <form name="studentForm" class="form-box" ng-submit="formCtrl.submit(studentForm)" novalidate>
        <div class="field">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" ng-model="formCtrl.student.name" placeholder="Enter full name">
          <div class="field-error">{{ formCtrl.errors.name }}</div>
        </div>
        <div class="field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" ng-model="formCtrl.student.email" placeholder="student@example.com">
          <div class="field-error">{{ formCtrl.errors.email }}</div>
        </div>
        <div class="field">
          <label for="department">Department *</label>
          <select id="department" name="department" ng-model="formCtrl.student.department" ng-options="department for department in formCtrl.departments">
            <option value="">-- Select department --</option>
          </select>
          <div class="field-error">{{ formCtrl.errors.department }}</div>
        </div>
        <div class="field">
          <label for="yearOfStudy">Year of Study *</label>
          <select id="yearOfStudy" name="yearOfStudy" ng-model="formCtrl.student.yearOfStudy" ng-options="year.value as year.label for year in formCtrl.years">
            <option value="">-- Select year --</option>
          </select>
          <div class="field-error">{{ formCtrl.errors.yearOfStudy }}</div>
        </div>
        <div class="form-buttons">
          <button type="submit" class="btn">Submit</button>
          <button type="button" class="btn btn-secondary" ng-click="formCtrl.reset(studentForm)">Reset</button>
        </div>
      </form>
    </main>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="js/angular-app.js"></script>
</body>
</html>
