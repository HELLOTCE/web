<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Student Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body ng-app="studentPortalApp" ng-controller="PortalController as portal" ng-cloak>
  <div class="layout">
    <!-- ===== SIDEBAR (same on every page; edit link names here) ===== -->
    <aside class="sidebar">
      <div class="logo">{{ portal.siteName }}</div>
      <a class="nav-link" ng-repeat="page in portal.pages" ng-href="{{ page.href }}" ng-class="{active: page.href === 'about.html'}">{{ page.label }}</a>
    </aside>
    <main class="content" ng-controller="AboutController as about">
      <!-- EDIT: every heading and paragraph below can be changed freely -->
      <h1>About the Website</h1>

      <div class="about-section" ng-repeat="section in about.sections">
        <h2>{{ section.title }}</h2>
        <p>{{ section.text }}</p>
      </div>

      <div class="about-section">
        <h2>Services / Features</h2>
        <ul>
          <li ng-repeat="feature in about.features">{{ feature }}</li>
        </ul>
      </div>
    </main>
  </div>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
  <script src="js/angular-app.js"></script>
</body>
</html>
