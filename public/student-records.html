<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Records - Student Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/site-config.js"></script>
  <script src="js/validators.js"></script>
  <script src="js/auth.js"></script>
  <script>requireLogin(); // visitors who are not logged in are sent to the login page</script>
</head>
<body>
  <div class="layout">
    <!-- ===== SIDEBAR (same on every page; edit link names here) ===== -->
    <aside class="sidebar">
      <div class="logo" data-site-name>Student Portal</div>
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="about.html">About</a>
      <a class="nav-link" href="student-form.html">Student Form</a>
      <a class="nav-link active" href="student-records.html">Student Records</a>
      <button class="btn btn-secondary" onclick="logout()">Logout</button>
    </aside>
    <main class="content">
      <h1>Student Records</h1>
      <p>These records are loaded from MongoDB through the API (<code>GET /api/students</code>).</p>

      <div id="recordsMessage" class="message"></div>

      <table>
        <thead>
          <tr><th>#</th><th>Name</th><th>Email</th><th>Department</th><th>Year</th></tr>
        </thead>
        <tbody id="recordsBody">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </main>
  </div>
  <script src="js/student-records.js"></script>
</body>
</html>
